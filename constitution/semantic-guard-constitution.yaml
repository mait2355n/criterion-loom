identity:
  product_ref: semantic-guard v1・product.semantic-guard
  canonical_implementation_ref: semantic-guard v1・implementation.semantic-guard.v1
  derived_from: semantic-guard vNext candidate・implementation.semantic-guard.vnext
  legacy_predecessor_ref: semantic-guard v0.1.0・implementation.semantic-guard.v0.1.0
  audit_owner: semantic-guard
  control_owner: external_caller_or_resource_control_plane
  final_acceptance_owner: human

origin:
  - ref: 原点要求・document.prototype-origin-requirement.v2
    path: docs/prototypes/origin-requirement.md
    content_digest:
      algorithm: sha256
      value: 5e05f6227998e447cff94b085a0716bb222c7e3987f81278e7218775d0536b0f
    strengthens: [OR-01, OR-02, OR-03]
  - ref: 要求関係監査試作憲章・document.requirement-relation-audit-charter.v0
    path: docs/prototypes/requirement-relation-audit-charter-2026-07-12.md
    content_digest:
