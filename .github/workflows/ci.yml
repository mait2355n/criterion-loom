name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.10.10"

jobs:
  v1-contract:
    name: v1 contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv==${{ env.UV_VERSION }}"

      - name: Verify Python and uv identity
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python -c "import os, sys; expected = tuple(map(int, os.environ['EXPECTED_PYTHON'].split('.'))); actual = sys.version_info[:2]; sys.exit(f'Python runtime mismatch: {actual!r} != {expected!r}') if actual != expected else None"
          python -c "import os, subprocess, sys; observed = subprocess.check_output(['uv', '--version'], text=True).split(); expected = os.environ['UV_VERSION']; sys.exit(f'uv runtime mismatch: {observed!r}; expected uv {expected}') if observed[:2] != ['uv', expected] else None"

      - name: Verify lockfile and environment
        run: |
          uv lock --check
          uv sync --locked --python ${{ matrix.python-version }}

      - name: Compile canonical source and tests
        run: uv run --locked python -m compileall -q src/semantic_guard tests scripts

      - name: Run full canonical test suite
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Validate verification source
        run: uv run --locked python scripts/validate_verification_source.py

      - name: Check generated verification projection
        run: uv run --locked python scripts/render_verification_projection.py --check

      - name: Validate engineering rule pack
        run: uv run --locked python scripts/validate_engineering_rule_pack.py

      - name: Smoke canonical CLI
        run: |
          uv run --locked semantic-guard --help
          uv run --locked semantic-guard schema audit-result > /tmp/semantic-guard-audit-result.schema.json
          uv run --locked semantic-guard audit-requirement --text "The system shall retain the audit result."

  legacy-smoke:
    name: archived 0.1.0 runtime smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/semantic-guard-v0.1.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install "uv==${{ env.UV_VERSION }}"

      - name: Verify Python and uv identity
        env:
          EXPECTED_PYTHON: "3.13"
        run: |
          python -c "import os, sys; expected = tuple(map(int, os.environ['EXPECTED_PYTHON'].split('.'))); actual = sys.version_info[:2]; sys.exit(f'Python runtime mismatch: {actual!r} != {expected!r}') if actual != expected else None"
          python -c "import os, subprocess, sys; observed = subprocess.check_output(['uv', '--version'], text=True).split(); expected = os.environ['UV_VERSION']; sys.exit(f'uv runtime mismatch: {observed!r}; expected uv {expected}') if observed[:2] != ['uv', expected] else None"

      - name: Prepare archived 0.1.0 environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/semantic-guard-legacy-v0.1.0
        run: uv sync --locked --python 3.13

      - name: Run bounded legacy smoke tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/semantic-guard-legacy-v0.1.0
        run: uv run --locked python -m unittest tests.test_core tests.test_cli -v

      - name: Smoke explicit legacy CLI
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/semantic-guard-legacy-v0.1.0
        run: |
          uv run --locked semantic-guard --help
          uv run --locked semantic-guard audit-request --text "利用者: 開発者。目的: 監査結果を保存する。受入基準: JSON が出力される。"

  package:
    name: wheel and installed public surface
    runs-on: ubuntu-latest
    needs: [v1-contract, legacy-smoke]
    outputs:
      artifact_name: ${{ steps.distribution.outputs.artifact_name }}
      sdist_filename: ${{ steps.distribution.outputs.sdist_filename }}
      wheel_filename: ${{ steps.distribution.outputs.wheel_filename }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install "uv==${{ env.UV_VERSION }}"

      - name: Verify Python and uv identity
        env:
          EXPECTED_PYTHON: "3.13"
        run: |
          python -c "import os, sys; expected = tuple(map(int, os.environ['EXPECTED_PYTHON'].split('.'))); actual = sys.version_info[:2]; sys.exit(f'Python runtime mismatch: {actual!r} != {expected!r}') if actual != expected else None"
          python -c "import os, subprocess, sys; observed = subprocess.check_output(['uv', '--version'], text=True).split(); expected = os.environ['UV_VERSION']; sys.exit(f'uv runtime mismatch: {observed!r}; expected uv {expected}') if observed[:2] != ['uv', expected] else None"

      - name: Build canonical wheel and source distribution
        run: |
          uv lock --check
          uv build --out-dir dist
          python - <<'PY'
          from pathlib import Path

          marker = Path("dist/.gitignore")
          if marker.is_symlink() or not marker.is_file() or marker.read_bytes() != b"*":
              raise SystemExit("uv build marker differs from the reviewed single-byte form")
          marker.unlink()
          PY

      - name: Bind distributions to checked-out source
        id: distribution
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python scripts/distribution_binding.py create \
            --project-root . \
            --dist-dir dist \
            --expected-commit "$EXPECTED_COMMIT"
          python scripts/distribution_binding.py check \
            --project-root . \
            --dist-dir dist \
            --expected-commit "$EXPECTED_COMMIT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("dist/distribution-binding.json").read_text(encoding="utf-8"))
          artifacts = {item["kind"]: item["filename"] for item in manifest["artifacts"]}
          if set(artifacts) != {"wheel", "sdist"}:
              raise SystemExit("distribution binding does not name one wheel and one sdist")
          version = manifest["project"]["version"]
          artifact_name = f"semantic-guard-{version}-{os.environ['EXPECTED_COMMIT'][:12]}-distributions"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"artifact_name={artifact_name}\n")
              output.write(f"wheel_filename={artifacts['wheel']}\n")
              output.write(f"sdist_filename={artifacts['sdist']}\n")
          PY

      - name: Verify packaged contracts
        run: |
          WHEEL="dist/${{ steps.distribution.outputs.wheel_filename }}"
          SDIST="dist/${{ steps.distribution.outputs.sdist_filename }}"
          uv run --locked python scripts/verify_packaged_contracts.py --wheel "$WHEEL" --sdist "$SDIST"

      - name: Verify installed CLI and MCP inventory
        run: |
          WHEEL="dist/${{ steps.distribution.outputs.wheel_filename }}"
          VENV="$RUNNER_TEMP/semantic-guard-installed"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "$WHEEL"
          "$VENV/bin/semantic-guard" --help
          "$VENV/bin/semantic-guard" schema audit-result > "$RUNNER_TEMP/audit-result.schema.json"
          "$VENV/bin/semantic-guard" schema direction-binding-audit > "$RUNNER_TEMP/direction-binding-audit.schema.json"
          "$VENV/bin/semantic-guard" audit-direction-binding \
            --text '横一列で、Aの次の項目はどれですか？' \
            --recorded-at '2026-08-23T00:00:00Z' \
            > "$RUNNER_TEMP/direction-binding-audit.json"
          test -x "$VENV/bin/semantic-guard-mcp"
          "$VENV/bin/python" - <<'PY'
          import asyncio
          from semantic_guard.mcp_server import mcp

          expected = {
              "audit_direction_binding_tool",
              "audit_requirement_relations_tool",
              "shadow_compare_legacy_tool",
              "semantic_guard_schema_tool",
          }
          actual = {tool.name for tool in asyncio.run(mcp.list_tools())}
          if actual != expected:
              raise SystemExit(f"installed MCP inventory mismatch: {sorted(actual)}")
          _, payload = asyncio.run(
              mcp.call_tool(
                  "audit_direction_binding_tool",
                  {
                      "text": "横一列で、Aの次の項目はどれですか？",
                      "recorded_at": "2026-08-23T00:00:00Z",
                  },
              )
          )
          if payload["primary_rule_evaluation"]["state"] != "indeterminate":
              raise SystemExit("installed direction-binding dispatch did not fail closed")
          PY

      - name: Upload bound distributions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.distribution.outputs.artifact_name }}
          path: |
            dist/${{ steps.distribution.outputs.wheel_filename }}
            dist/${{ steps.distribution.outputs.sdist_filename }}
            dist/distribution-binding.json
            dist/SHA256SUMS
          if-no-files-found: error

  package-portability:
    name: bound wheel / Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out bound source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Python identity
        shell: python
        run: |
          import sys
          expected = (3, 12)
          actual = sys.version_info[:2]
          if actual != expected:
              raise SystemExit(f"Python runtime mismatch: {actual!r} != {expected!r}")

      - name: Download bound distributions
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: dist

      - name: Recheck distribution binding
        run: >-
          python scripts/distribution_binding.py check
          --project-root .
          --dist-dir dist
          --expected-commit "${{ github.sha }}"

      - name: Verify packaged contracts on target environment
        run: >-
          python scripts/verify_packaged_contracts.py
          --wheel "dist/${{ needs.package.outputs.wheel_filename }}"
          --sdist "dist/${{ needs.package.outputs.sdist_filename }}"
          --timeout-seconds 300
