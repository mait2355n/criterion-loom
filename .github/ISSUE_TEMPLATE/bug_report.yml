name: Bug report
description: Report a reproducible semantic-guard problem.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What behaved incorrectly?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or input
      description: Include the command, input shape, or fixture path. Redact sensitive text.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and surface
      description: State the semantic-guard version and whether this is canonical v1 or the archived 0.1.0 runtime.
      placeholder: "semantic-guard 1.1.0 / audit-direction-binding"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should semantic-guard have reported?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include workflow disposition, obligation outcome, coverage, challenge, error, or traceback.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Mention tests, validators, schema validation, and whether optional providers were configured.
      render: shell
    validations:
      required: false
