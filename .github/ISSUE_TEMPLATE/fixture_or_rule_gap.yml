name: Requirement relation or rule gap
description: Propose a conformance example, false satisfaction, false refutation, abstention, or rule gap.
title: "[calibration]: "
labels: ["calibration"]
body:
  - type: dropdown
    id: gap_kind
    attributes:
      label: Gap kind
      options:
        - correct obligation result to preserve
        - likely false satisfaction
        - likely false refutation
        - missed challenge or unresolved obligation
        - analyzer coverage or provenance gap
        - rule wording or documentation issue
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Provide the smallest redacted input that shows the gap.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected_review
    attributes:
      label: Expected review
      description: Which obligation, outcome, challenge, coverage, or unresolved state should differ?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Engineering obligation
      description: Tie the example to a versioned rule, engineering source, applicability condition, counter-condition, required evidence, and limitation where possible.
    validations:
      required: false
