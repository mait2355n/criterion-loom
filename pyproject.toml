[project]
name = "semantic-guard"
version = "1.2.0.dev0"
description = "Criterion Loom audit kernel with explicit workflow and governed-candidate interfaces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aster00" }]
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.26,<5",
  "mcp>=1.14,<2",
  "cryptography>=49,<50",
]

[project.optional-dependencies]
nlp-ja = [
  "SudachiDict-core==20260428",
  "SudachiPy>=0.6.11,<0.7",
]
nlp-ja-dependency = [
  "ginza>=5.2,<6",
  "ja-ginza>=5.2,<6",
]

[project.scripts]
semantic-guard = "semantic_guard.cli:main"
semantic-guard-mcp = "semantic_guard.mcp_server:main"
semantic-guard-workflow = "semantic_guard_workflow.cli:main"
semantic-guard-workflow-mcp = "semantic_guard_workflow.mcp_server:main"
semantic-guard-vnext = "semantic_guard_vnext.cli:main"
semantic-guard-vnext-mcp = "semantic_guard_vnext.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_guard", "src/semantic_guard_workflow", "src/semantic_guard_vnext", "src/semantic_guard_u10_broker"]

[tool.hatch.build.targets.wheel.force-include]
"constitution" = "semantic_guard/constitution"
"schemas" = "semantic_guard/schemas"
"validation/lifecycle-profile-registry.candidate.json" = "semantic_guard/validation/lifecycle-profile-registry.candidate.json"
"validation/engineering-rule-pack.candidate.json" = "semantic_guard/validation/engineering-rule-pack.candidate.json"
"validation/engineering-rule-pack.schema.json" = "semantic_guard/validation/engineering-rule-pack.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src/semantic_guard",
  "/src/semantic_guard_workflow",
  "/src/semantic_guard_vnext",
  "/src/semantic_guard_u10_broker",
  "/schemas",
  "/constitution",
  "/validation/lifecycle-profile-registry.candidate.json",
  "/validation/engineering-rule-pack.candidate.json",
  "/validation/engineering-rule-pack.schema.json",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
